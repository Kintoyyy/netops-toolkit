<!-- title: Blocklist Converter | desc: Turn hosts files, Adblock lists, URLs or plain domains into BIND RPZ, Unbound, dnsmasq, MikroTik, Pi-hole/AdGuard, Squid or ipset format. Fully offline. -->
<section class="panel">
  <label class="small" for="raw">Input — any mix of hosts lines, ||adblock^ rules, dnsmasq/unbound/RPZ entries, URLs, plain domains, IPs or CIDRs</label>
  <textarea id="raw" spellcheck="false" style="min-height:180px" placeholder="0.0.0.0 ads.example.com&#10;||tracker.example.net^&#10;https://phish.example.org/login&#10;malware.example.top&#10;203.0.113.0/24"></textarea>
  <div class="row">
    <label class="btn" for="file">Load file…</label><input type="file" id="file" accept=".txt,.list,.conf,.hosts,.zone,text/*">
    <label class="chk"><input type="checkbox" id="optCollapse" checked> Drop subdomains already covered by a parent</label>
    <label class="chk"><input type="checkbox" id="optSort" checked> Sort</label>
    <span class="muted" id="stats"></span>
  </div>
</section>

<section class="panel">
  <div class="chips" id="fmts"></div>
  <div class="row">
    <label class="small" style="margin:0">Action</label>
    <select id="action"><option value="nx">NXDOMAIN</option><option value="nodata">NODATA</option><option value="sink">Sinkhole IP</option></select>
    <input type="text" id="sink" class="mono" value="0.0.0.0" style="width:140px" title="Sinkhole IP">
    <label class="small" style="margin:0 0 0 8px">Name / comment</label>
    <input type="text" id="name" class="mono" value="blocklist" style="width:140px">
    <span style="flex:1"></span>
    <button id="cp">Copy</button><button class="primary" id="dl">Download</button>
  </div>
  <p class="note" id="fmtNote"></p>
  <pre id="out" style="margin-top:8px;max-height:480px"></pre>
</section>

<script>
const FORMATS = {
  plain:   { label: 'Plain list', ext: 'txt', note: 'One domain per line.' },
  hosts:   { label: 'hosts', ext: 'hosts', note: 'Exact-match only — hosts files cannot block subdomains.' },
  adblock: { label: 'AdGuard / Pi-hole', ext: 'txt', note: '||domain^ blocks the domain and all subdomains. Works in AdGuard Home, Pi-hole v5.x+ and uBlock Origin.' },
  rpz:     { label: 'BIND / Unbound RPZ', ext: 'rpz', note: 'Response Policy Zone file. Load as a type master zone and reference it in response-policy { zone "rpz.local"; };' },
  unbound: { label: 'Unbound', ext: 'conf', note: 'local-zone entries — include from unbound.conf under server:.' },
  dnsmasq: { label: 'dnsmasq', ext: 'conf', note: 'Drop into /etc/dnsmasq.d/. Matches subdomains automatically.' },
  mtdns:   { label: 'MikroTik DNS static', ext: 'rsc', note: 'RouterOS v7. Paste into terminal or /import. Clients must use the router as DNS (redirect UDP/TCP 53 to enforce).' },
  mtaddr:  { label: 'MikroTik address-list', ext: 'rsc', note: 'Firewall address-list — IPs/CIDRs block directly; domains are resolved by RouterOS and refreshed per TTL.' },
  squid:   { label: 'Squid ACL', ext: 'txt', note: 'For acl NAME dstdomain "/etc/squid/blocklist.txt" — leading dot matches subdomains.' },
  ipset:   { label: 'ipset (IPs only)', ext: 'ipset', note: 'Use with ipset restore. Only IP/CIDR entries are included.' },
};
let fmt = 'rpz';
$('#fmts').innerHTML = Object.entries(FORMATS).map(([k, f]) => `<span class="chip ${k === fmt ? 'on' : ''}" data-f="${k}">${f.label}</span>`).join('');
$('#fmts').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; fmt = c.dataset.f; $$('#fmts .chip').forEach(x => x.classList.toggle('on', x === c)); convert(); };

const SKIP = new Set(['localhost', 'localhost.localdomain', 'local', 'broadcasthost', 'ip6-localhost', 'ip6-loopback', 'ip6-localnet', 'ip6-mcastprefix', 'ip6-allnodes', 'ip6-allrouters', 'ip6-allhosts', '0.0.0.0']);
function validDomain(d){
  if (!d || d.length > 253 || SKIP.has(d)) return null;
  if (/[^\x00-\x7f]/.test(d)) { try { d = new URL('http://' + d).hostname; } catch { return null; } }
  const labels = d.split('.');
  if (labels.length < 2 || !/^(xn--[a-z0-9-]+|[a-z]{2,63})$/.test(labels.at(-1))) return null;
  return labels.every(l => /^[a-z0-9_](?:[a-z0-9_-]{0,61}[a-z0-9_])?$/.test(l)) ? d : null;
}
function parse(text){
  const domains = new Set(), ips = new Set(); let skipped = 0;
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line || /^[#!;]|^\[|^\/\//.test(line)) continue;
    if (line.startsWith('@@') || line.includes('##') || line.includes('#@#')) { skipped++; continue; }
    line = line.replace(/\s+#.*$/, '');
    let m, cands = [];
    if ((m = line.match(/^\|\|([^\^\/$|]+)\^?/))) cands = [m[1]];
    else if ((m = line.match(/^(?:address|server|local)=\/([^\/]+)\//))) cands = m[1].split('/');
    else if ((m = line.match(/^local-zone:\s*"?([^"\s]+?)\.?"?\s/))) cands = [m[1]];
    else if ((m = line.match(/^(\*\.)?([^\s]+?)\.?\s+(?:\d+\s+)?(?:IN\s+)?CNAME\s/i))) cands = [m[2]];
    else if ((m = line.match(/^(?:0\.0\.0\.0|127\.\d+\.\d+\.\d+|::1?|::)\s+(.+)$/))) cands = m[1].split(/\s+/);
    else cands = line.split(/[\s,]+/);
    for (let c of cands) {
      c = c.trim().toLowerCase().replace(/^[a-z][a-z0-9+.-]*:\/\//, '').replace(/^[^@\/]*@/, '').split(/[\/?#^$]/)[0].replace(/:\d+$/, '').replace(/^\*?\./, '').replace(/\.$/, '');
      if (!c) continue;
      const cidr = c.match(/^([0-9a-f:.]+)(?:\/(\d{1,3}))?$/);
      if (cidr && ipKind(cidr[1])) { ips.add(c); continue; }
      const d = validDomain(c); d ? domains.add(d) : skipped++;
    }
  }
  return { domains: [...domains], ips: [...ips], skipped };
}
function collapse(list){
  const set = new Set(list);
  return list.filter(d => { const p = d.split('.'); for (let i = 1; i < p.length - 1; i++) if (set.has(p.slice(i).join('.'))) return false; return true; });
}

let output = '';
function convert(){
  const { domains: all, ips, skipped } = parse($('#raw').value);
  let doms = $('#optCollapse').checked ? collapse(all) : all;
  if ($('#optSort').checked) { doms = doms.sort((a, b) => a.split('.').reverse().join('.').localeCompare(b.split('.').reverse().join('.'))); ips.sort(); }
  const act = $('#action').value, sink = $('#sink').value.trim() || '0.0.0.0', name = ($('#name').value.trim() || 'blocklist').replace(/\s+/g, '-');
  const sink6 = ipKind(sink) === 6;
  const stamp = new Date().toISOString().slice(0, 19).replace('T', ' ');
  const hdr = c => `${c} Generated by NetOps Toolkit — ${stamp} UTC — ${doms.length} domains${ips.length ? `, ${ips.length} IPs` : ''}\n`;
  $('#sink').style.display = act === 'sink' || ['hosts', 'mtdns'].includes(fmt) ? '' : 'none';
  $('#stats').textContent = `${all.length} unique domains${all.length !== doms.length ? ` (${all.length - doms.length} covered by parent)` : ''} · ${ips.length} IPs/CIDRs${skipped ? ` · ${skipped} skipped` : ''}`;
  $('#fmtNote').textContent = FORMATS[fmt].note + (ips.length && !['mtaddr', 'ipset', 'plain'].includes(fmt) ? ` ${ips.length} IP entries are omitted in this DNS format.` : '');

  switch (fmt) {
    case 'plain': output = hdr('#') + [...doms, ...ips].join('\n'); break;
    case 'hosts': output = hdr('#') + doms.map(d => `${sink} ${d}`).join('\n'); break;
    case 'adblock': output = hdr('!') + doms.map(d => `||${d}^`).join('\n'); break;
    case 'rpz': {
      const serial = new Date().toISOString().slice(0, 10).replace(/-/g, '') + '01';
      const rr = act === 'nx' ? 'CNAME .' : act === 'nodata' ? 'CNAME *.' : `${sink6 ? 'AAAA' : 'A'} ${sink}`;
      output = hdr(';') + `$TTL 300\n@ IN SOA localhost. hostmaster.localhost. ( ${serial} 3600 600 86400 300 )\n  IN NS localhost.\n\n` +
        doms.map(d => `${d} ${rr}\n*.${d} ${rr}`).join('\n'); break;
    }
    case 'unbound': {
      const t = act === 'nx' ? 'always_nxdomain' : act === 'nodata' ? 'always_nodata' : sink === '0.0.0.0' || sink === '::' ? 'always_null' : 'redirect';
      output = hdr('#') + doms.map(d => t === 'redirect' ? `local-zone: "${d}." redirect\nlocal-data: "${d}. ${sink6 ? 'AAAA' : 'A'} ${sink}"` : `local-zone: "${d}." ${t}`).join('\n'); break;
    }
    case 'dnsmasq': output = hdr('#') + doms.map(d => act === 'sink' ? `address=/${d}/${sink}` : act === 'nodata' ? `address=/${d}/#` : `local=/${d}/`).join('\n'); break;
    case 'mtdns': output = hdr('#') + '/ip dns static\n' + doms.map(d => act === 'sink' ? `add name=${d} ${sink6 ? 'type=AAAA ' : ''}address=${sink} match-subdomain=yes comment=${name}` : `add name=${d} type=NXDOMAIN match-subdomain=yes comment=${name}`).join('\n'); break;
    case 'mtaddr': {
      const v4 = ips.filter(i => !i.includes(':')), v6 = ips.filter(i => i.includes(':'));
      output = hdr('#') + '/ip firewall address-list\n' + [...v4, ...doms].map(a => `add list=${name} address=${a}`).join('\n') +
        (v6.length ? '\n/ipv6 firewall address-list\n' + v6.map(a => `add list=${name} address=${a}`).join('\n') : ''); break;
    }
    case 'squid': output = hdr('#') + doms.map(d => '.' + d).join('\n'); break;
    case 'ipset': {
      const v4 = ips.filter(i => !i.includes(':')), v6 = ips.filter(i => i.includes(':'));
      output = hdr('#') + (v4.length ? `create ${name} hash:net family inet -exist\n` + v4.map(i => `add ${name} ${i} -exist`).join('\n') : '') +
        (v6.length ? `\ncreate ${name}6 hash:net family inet6 -exist\n` + v6.map(i => `add ${name}6 ${i} -exist`).join('\n') : ''); break;
    }
  }
  const lines = output.split('\n');
  $('#out').textContent = lines.length > 3000 ? lines.slice(0, 3000).join('\n') + `\n… (${lines.length - 3000} more lines — use Download)` : output;
}
$('#cp').onclick = e => copyText(output, e.target);
$('#dl').onclick = () => download(`${($('#name').value.trim() || 'blocklist')}.${FORMATS[fmt].ext}`, output);
['#raw', '#sink', '#name'].forEach(s => $(s).addEventListener('input', convert));
['#action', '#optCollapse', '#optSort'].forEach(s => $(s).addEventListener('change', convert));
$('#file').onchange = async e => { const f = e.target.files[0]; if (!f) return; $('#raw').value = await f.text(); e.target.value = ''; convert(); };
convert();
</script>
