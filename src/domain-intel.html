<!-- title: Domain & IP Intel | desc: RDAP (modern WHOIS) for domains, IPs and ASNs — registrar, dates, abuse contacts, network owner, geolocation and reverse DNS. -->
<section class="panel">
  <div class="row">
    <input type="text" id="q" class="grow mono" placeholder="example.com, 1.1.1.1, 2606:4700::1111 or AS13335" autocomplete="off" spellcheck="false">
    <button class="primary" id="go">Lookup</button>
  </div>
  <p class="note">Uses public RDAP via rdap.org, with geolocation from ipwho.is / ipapi.co. Queries go straight from your browser to those services.</p>
</section>
<div id="out"></div>

<script>
async function getJSON(url){
  const r = await fetch(url, { headers: { accept: 'application/rdap+json, application/json' } });
  if (r.status === 404) { const e = new Error('Not found (404)'); e.code = 404; throw e; }
  if (!r.ok) throw new Error(`HTTP ${r.status} from ${new URL(url).host}`);
  return r.json();
}
let ianaDns = null;
async function rdapDomain(d){
  try { return { j: await getJSON('https://rdap.org/domain/' + d), src: 'rdap.org' }; }
  catch (e) {
    if (e.code === 404) throw e;
    ianaDns = ianaDns || await getJSON('https://data.iana.org/rdap/dns.json');
    const tld = d.split('.').pop();
    const svc = ianaDns.services.find(s => s[0].includes(tld));
    if (!svc) throw new Error(`No RDAP server published for .${tld}`);
    const base = svc[1][0].replace(/\/?$/, '/');
    return { j: await getJSON(base + 'domain/' + d), src: new URL(base).host };
  }
}
async function rdapIP(ip){
  try { return { j: await getJSON('https://rdap.org/ip/' + ip), src: 'rdap.org' }; }
  catch { return { j: await getJSON('https://rdap.arin.net/registry/ip/' + ip), src: 'rdap.arin.net' }; }
}
async function rdapASN(n){
  try { return { j: await getJSON('https://rdap.org/autnum/' + n), src: 'rdap.org' }; }
  catch { return { j: await getJSON('https://rdap.arin.net/registry/autnum/' + n), src: 'rdap.arin.net' }; }
}
async function geo(ip){
  try {
    const j = await getJSON('https://ipwho.is/' + ip);
    if (j.success === false) throw new Error(j.message);
    return { src: 'ipwho.is', country: j.country, cc: j.country_code, region: j.region, city: j.city, lat: j.latitude, lon: j.longitude,
      asn: j.connection?.asn, org: j.connection?.org, isp: j.connection?.isp, tz: j.timezone?.id };
  } catch {
    const j = await getJSON(`https://ipapi.co/${ip}/json/`);
    if (j.error) throw new Error(j.reason);
    return { src: 'ipapi.co', country: j.country_name, cc: j.country_code, region: j.region, city: j.city, lat: j.latitude, lon: j.longitude,
      asn: (j.asn || '').replace(/^AS/, ''), org: j.org, isp: j.org, tz: j.timezone };
  }
}

/* ---- RDAP parsing ---- */
function vcard(e){
  const out = {}; const arr = e.vcardArray?.[1] || [];
  for (const [k, , , v] of arr) {
    if (k === 'fn') out.name = v;
    if (k === 'org') out.org = Array.isArray(v) ? v.join(' ') : v;
    if (k === 'email') (out.email ||= []).push(v);
    if (k === 'tel') (out.tel ||= []).push(String(v).replace(/^tel:/, ''));
    if (k === 'adr') out.adr = arr.find(x => x[0] === 'adr')?.[1]?.label || (Array.isArray(v) ? v.filter(Boolean).join(', ') : v);
  }
  return out;
}
function flatEntities(list, acc = []){
  for (const e of list || []) { acc.push(e); flatEntities(e.entities, acc); }
  return acc;
}
const ev = (j, a) => (j.events || []).find(x => x.eventAction === a)?.eventDate;
const kvHTML = obj => `<div class="kv">${Object.entries(obj).filter(([, v]) => v != null && v !== '').map(([k, v]) => `<div>${esc(k)}</div><div>${v}</div>`).join('')}</div>`;
function entitiesTable(j){
  const ents = flatEntities(j.entities).filter(e => e.vcardArray || e.handle);
  if (!ents.length) return '';
  return `<h3>Contacts</h3><div class="tablewrap"><table><thead><tr><th>Role</th><th>Name / Org</th><th>Email</th><th>Phone</th><th>Handle</th></tr></thead><tbody>
    ${ents.map(e => { const v = vcard(e); return `<tr><td>${(e.roles || []).map(r => `<span class="b ${r === 'abuse' ? 'b-bad' : 'b-info'}">${esc(r)}</span>`).join(' ')}</td>
      <td>${esc(v.name || v.org || '—')}${v.org && v.name && v.org !== v.name ? `<div class="muted">${esc(v.org)}</div>` : ''}${v.adr ? `<div class="muted" style="font-size:12px">${esc(v.adr)}</div>` : ''}</td>
      <td class="mono">${(v.email || []).map(m => `<a href="mailto:${esc(m)}">${esc(m)}</a>`).join('<br>') || '—'}</td>
      <td class="mono">${esc((v.tel || []).join(', ') || '—')}</td><td class="mono">${esc(e.handle || '')}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
const raw = (j, src) => `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">Raw RDAP JSON (${esc(src)})</summary><pre style="margin-top:6px;max-height:420px">${esc(JSON.stringify(j, null, 2))}</pre></details>`;
function statusBadges(s){ return (s || []).map(x => `<span class="b ${/hold|pending delete|redemption/i.test(x) ? 'b-bad' : /prohibited|lock/i.test(x) ? 'b-ok' : 'b-mute'}">${esc(x)}</span>`).join(' '); }

async function showDomain(input){
  let d = input, res;
  for (;;) {
    try { res = await rdapDomain(d); break; }
    catch (e) { if (e.code === 404 && d.split('.').length > 2) { d = d.split('.').slice(1).join('.'); continue; } throw e; }
  }
  const j = res.j;
  const reg = ev(j, 'registration'), exp = ev(j, 'expiration'), chg = ev(j, 'last changed');
  const now = new Date();
  const age = reg ? daysBetween(reg, now) : null, left = exp ? daysBetween(now, exp) : null;
  const registrar = flatEntities(j.entities).find(e => e.roles?.includes('registrar'));
  const ianaId = registrar?.publicIds?.find(p => /iana/i.test(p.type))?.identifier;
  let html = `<section class="panel"><div class="row" style="margin-top:0"><b class="mono" style="font-size:15px">${esc(j.ldhName || d)}</b>
    ${age != null && age < 30 ? '<span class="b b-bad">Newly registered</span>' : age != null && age < 180 ? '<span class="b b-warn">Under 6 months old</span>' : ''}
    ${left != null && left < 30 ? '<span class="b b-warn">Expiring soon</span>' : ''}
    <span style="flex:1"></span><a class="btn" href="../dns-lookup/?q=${encodeURIComponent(d)}">DNS records →</a><a class="btn" href="../email-security/?q=${encodeURIComponent(d)}">Email security →</a></div>
    ${d !== input ? `<p class="note">Showing registrable domain <span class="mono">${esc(d)}</span> for <span class="mono">${esc(input)}</span>.</p>` : ''}
    <div style="margin-top:12px">${kvHTML({
      Registrar: registrar ? esc(vcard(registrar).name || registrar.handle) + (ianaId ? ` <span class="muted">(IANA ${esc(ianaId)})</span>` : '') : null,
      Registered: reg ? `${esc(fmtDate(reg))} <span class="muted">— ${age.toLocaleString()} days ago</span>` : null,
      Expires: exp ? `${esc(fmtDate(exp))} <span class="muted">— ${left < 0 ? 'expired' : `in ${left.toLocaleString()} days`}</span>` : null,
      'Last changed': chg ? esc(fmtDate(chg)) : null,
      Status: statusBadges(j.status),
      Nameservers: (j.nameservers || []).map(n => esc((n.ldhName || '').toLowerCase())).join('<br>'),
      DNSSEC: j.secureDNS ? (j.secureDNS.delegationSigned ? '<span class="b b-ok">signed</span>' : '<span class="b b-mute">unsigned</span>') : null,
    })}</div>${entitiesTable(j)}${raw(j, res.src)}</section>`;
  $('#out').innerHTML = html;
}

async function showIP(ip){
  const [r, g, p] = await Promise.allSettled([rdapIP(ip), geo(ip), doh(ptrName(ip), 'PTR')]);
  const special = ipKind(ip) === 4 ? v4Special(parseIPv4(ip)) : v6Special(parseIPv6(ip));
  const ptr = p.status === 'fulfilled' ? (p.value.Answer || []).filter(a => a.type === 12).map(a => a.data) : [];
  let html = `<section class="panel"><div class="row" style="margin-top:0"><b class="mono" style="font-size:15px">${esc(ip)}</b>
    ${special ? `<span class="b b-warn">${esc(special)}</span>` : ''}</div><div class="grid2" style="margin-top:12px">`;
  if (g.status === 'fulfilled') {
    const x = g.value;
    html += `<div class="card"><div class="t">Location & network <span class="muted" style="font-weight:400;font-size:12px">${esc(x.src)}</span></div>${kvHTML({
      Country: x.country ? `${esc(x.country)} (${esc(x.cc)})` : null, Region: esc(x.region), City: esc(x.city),
      Coordinates: x.lat != null ? `<a href="https://www.openstreetmap.org/?mlat=${x.lat}&mlon=${x.lon}#map=10/${x.lat}/${x.lon}" target="_blank" rel="noopener">${x.lat}, ${x.lon} ↗</a>` : null,
      Timezone: esc(x.tz), ASN: x.asn ? `<a href="?q=AS${esc(x.asn)}">AS${esc(x.asn)}</a>` : null, Org: esc(x.org), ISP: esc(x.isp),
      'Reverse DNS': ptr.length ? ptr.map(esc).join('<br>') : '<span class="muted">none</span>' })}
      <p class="note">IP geolocation is approximate (city-level at best).</p></div>`;
  } else html += `<div class="card"><div class="t">Location</div><span class="muted">Unavailable: ${esc(g.reason.message)}</span>${ptr.length ? `<div style="margin-top:6px">PTR: <span class="mono">${ptr.map(esc).join(', ')}</span></div>` : ''}</div>`;
  if (r.status === 'fulfilled') {
    const j = r.value.j;
    const cidrs = (j.cidr0_cidrs || []).map(c => `${c.v4prefix || c.v6prefix}/${c.length}`).join(', ');
    const abuse = flatEntities(j.entities).filter(e => e.roles?.includes('abuse')).flatMap(e => vcard(e).email || []);
    html += `<div class="card"><div class="t">Registration (RDAP) <span class="muted" style="font-weight:400;font-size:12px">${esc(r.value.src)}</span></div>${kvHTML({
      'Net name': esc(j.name), Handle: esc(j.handle), Range: `${esc(j.startAddress)} – ${esc(j.endAddress)}`, CIDR: esc(cidrs),
      Type: esc(j.type), Country: esc(j.country), 'Parent handle': esc(j.parentHandle),
      'Abuse contact': abuse.length ? abuse.map(m => `<a href="mailto:${esc(m)}">${esc(m)}</a>`).join('<br>') : null,
      Registered: esc(fmtDate(ev(j, 'registration'))), 'Last changed': esc(fmtDate(ev(j, 'last changed'))) })}</div></div>
      ${entitiesTable(j)}${raw(j, r.value.src)}`;
  } else html += `<div class="card"><div class="t">Registration</div><span class="muted">RDAP unavailable: ${esc(r.reason.message)}</span></div></div>`;
  html += `</section>`;
  $('#out').innerHTML = html;
}

async function showASN(n){
  const { j, src } = await rdapASN(n);
  $('#out').innerHTML = `<section class="panel"><div class="row" style="margin-top:0"><b class="mono" style="font-size:15px">AS${esc(n)}</b>
    <span style="flex:1"></span><a class="btn" href="https://bgp.he.net/AS${esc(n)}" target="_blank" rel="noopener">bgp.he.net ↗</a><a class="btn" href="https://bgp.tools/as/${esc(n)}" target="_blank" rel="noopener">bgp.tools ↗</a></div>
    <div style="margin-top:12px">${kvHTML({ Name: esc(j.name), Handle: esc(j.handle), Range: j.startAutnum !== j.endAutnum ? `AS${j.startAutnum} – AS${j.endAutnum}` : null, Country: esc(j.country), Type: esc(j.type),
      Registered: esc(fmtDate(ev(j, 'registration'))), 'Last changed': esc(fmtDate(ev(j, 'last changed'))), Remarks: (j.remarks || []).flatMap(r => r.description || []).map(esc).join('<br>') })}</div>
    ${entitiesTable(j)}${raw(j, src)}</section>`;
}

async function run(){
  const raw = $('#q').value.trim(); if (!raw) return;
  setParam('q', raw);
  $('#out').innerHTML = `<section class="panel"><span class="spin"></span> Looking up…</section>`;
  try {
    const asn = raw.match(/^as(\d+)$/i) || raw.match(/^(\d{1,10})$/);
    const host = cleanHost(raw);
    if (asn) await showASN(asn[1]);
    else if (ipKind(raw.trim())) await showIP(raw.trim());
    else if (ipKind(host)) await showIP(host);
    else if (/^[a-z0-9.-]+\.[a-z0-9-]{2,}$/i.test(host)) await showDomain(host);
    else throw new Error('Enter a domain, IP address or ASN (e.g. AS13335).');
  } catch (e) {
    $('#out').innerHTML = `<div class="err">${esc(e.message)}${/fetch/i.test(e.message) ? ' — the RDAP server may not allow browser requests, or a network filter blocked it.' : ''}</div>`;
  }
}
$('#go').onclick = run;
$('#q').addEventListener('keydown', e => e.key === 'Enter' && run());
if (getParam('q')) { $('#q').value = getParam('q'); run(); }
</script>
